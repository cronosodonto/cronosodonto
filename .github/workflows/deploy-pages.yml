name: Deploy Cronos Public Site

on:
  workflow_dispatch:
  push:
    branches: [ desmembrado-fase0 ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare minimal public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/downloads
          cp -a app assets login superadmin _site/
          for f in index.html favicon.ico favicon-48x48.png favicon-192x192.png apple-touch-icon.png CNAME sitemap.xml robots.txt .nojekyll VERSION; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -f downloads/CronosConnectorSetup.msi ]; then
            cp downloads/CronosConnectorSetup.msi _site/downloads/
          fi
          if [ -f downloads/connector-manifest.json ]; then
            cp downloads/connector-manifest.json _site/downloads/
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
